presets:
  styles:
    cinematic: 电影质感 — 专业打光、宽银幕构图、电影色调
    anime: 动漫风格 — 日系画风、鲜艳色彩、夸张表情
    realistic: 写实风格 — 真实光影、自然色彩、纪录片质感
    noir: 黑色电影 — 暗调光影、高对比度、冷峻氛围
    fantasy: 奇幻风格 — 魔法元素、华丽特效、异世界感
    vintage: 复古风格 — 胶片质感、暖色调、怀旧氛围
    minimalist: 极简风格 — 干净画面、留白构图、淡雅色调
    cyberpunk: 赛博朋克 — 霓虹灯光、科技感、暗色调
    watercolor: 水彩风格 — 柔和晕染、通透色彩、手绘质感
    ink_wash: 水墨风格 — 东方意境、留白泼墨、古典韵味
    comic: 漫画风格 — 粗线条、网点纸、分镜感
    oil_painting: 油画风格 — 厚涂笔触、浓郁色彩、古典构图
    steampunk: 蒸汽朋克 — 齿轮机械、铜色金属、维多利亚风
    pop_art: 波普艺术 — 高饱和、拼贴感、商业视觉
    glitch: 故障艺术 — 数字失真、RGB偏移、科技废墟感
    dream: 梦幻风格 — 柔焦朦胧、粉紫色调、超现实
    dark: 暗黑风格 — 低饱和、阴郁氛围、哥特元素
    pixel: 像素风格 — 复古游戏、8-bit、点阵画面
  genres:
    urban: 都市情感 — 现代城市背景、职场/恋爱/家庭
    suspense: 悬疑推理 — 悬念迭起、推理破案、心理博弈
    romance: 甜蜜恋爱 — 浪漫邂逅、甜蜜互动、情感纠葛
    action: 动作热血 — 激烈打斗、追逐场面、英雄主义
    comedy: 轻松喜剧 — 幽默搞笑、反转误会、欢乐日常
    horror: 惊悚恐怖 — 阴森氛围、恐怖元素、心理压迫
    scifi: 科幻未来 — 太空/未来/科技、赛博元素
    historical: 古装历史 — 古代背景、宫廷/武侠/历史
    campus: 校园青春 — 校园生活、青春成长、同学情谊
    family: 家庭温情 — 亲情温暖、家庭矛盾、成长治愈
    fantasy_xuanhuan: 玄幻仙侠 — 修仙升级、法术对决、异界大陆
    wuxia: 武侠江湖 — 刀光剑影、侠义恩仇、武林纷争
    mythology: 神话传说 — 上古神兽、天宫地府、仙魔大战
    adventure: 冒险探索 — 未知世界、寻宝探险、极限挑战
    workplace: 职场商战 — 商业博弈、创业奋斗、办公室政治
    sports: 体育竞技 — 热血赛场、逆袭夺冠、团队拼搏
    music_dance: 音乐舞蹈 — 舞台梦想、唱跳练习、偶像成长
    slice_of_life: 日常治愈 — 慢节奏、小确幸、温馨日常
    thriller: 惊悚犯罪 — 高智商犯罪、心理博弈、正邪对决
    war_military: 战争军事 — 战场硝烟、军人荣耀、生死抉择
    period: 年代怀旧 — 80/90年代、老街旧巷、时代记忆
    children: 儿童亲子 — 童趣故事、寓教于乐、温馨陪伴
  shot_types:
    特写: 面部/物体细节，情感冲击最强
    近景: 胸以上，对话/内心戏
    中景: 腰以上，日常交互/动作展示
    过肩: 双人对话，增强对话感
    全身: 完整人物，展示服装/姿态/动作
    全景: 人物+环境，建立空间关系
    远景: 环境为主，交代场景/营造氛围
  cameras:
    固定: 稳定叙事/对话场景/静态画面
    缓慢推近: 聚焦情绪/揭示细节/营造压迫感
    跟随平移: 角色行走/场景转换/动态叙事
    手持晃动: 紧张感/纪实感/追逐场景
    环绕: 展示全貌/仪式感/角色独白
    俯视: 渺小感/全局视角/上帝视角
    仰视: 威严感/压迫感/英雄登场
  emotions:
    happy: 开心
    sad: 悲伤
    worried: 担忧
    surprised: 惊讶
    angry: 愤怒
    calm: 平静
    neutral: 中性/无明显情绪
  shot_type_prompts:
    特写: extreme close-up shot, detailed face, looking at viewer
    近景: close-up shot, head and shoulders
    中景: medium shot, waist up
    过肩: over-the-shoulder shot
    全身: full body shot
    全景: wide shot, full scene
    远景: extreme wide shot, establishing shot
    双人全景: two-shot, both characters visible
    侧面特写: side profile close-up shot, detailed side view of face, from the side
    背面特写: back view close-up shot, seen from behind, back of head, facing away from
      viewer
  camera_prompts:
    固定: static camera
    缓慢推近: slow zoom in, dolly in
    跟随平移: tracking shot, pan
    手持晃动: handheld camera, slight shake
    环绕: orbiting camera, 360 degree
    俯视: top-down shot, bird's eye view
    仰视: low angle shot, looking up
  emotion_prompts:
    angry: angry, furrowed brows, clenched jaw
    sad: sad, teary eyes, downturned mouth
    happy: happy, bright smile, sparkling eyes
    worried: worried, anxious expression, biting lip
    surprised: surprised, wide eyes, open mouth
    smug: smug, slight smirk, raised chin
    serious: serious, focused expression, firm gaze
    calm: calm, serene expression, relaxed posture
    determined: determined, intense gaze, set jaw
    fearful: fearful, trembling, wide eyes
    neutral: neutral expression, natural pose
    romantic: romantic, soft gaze, gentle smile
    action: action pose, intense expression, dynamic
