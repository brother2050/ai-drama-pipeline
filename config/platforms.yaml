# 多平台分发预设 — 修改此文件即可适配新平台，无需改代码
#
# 字段说明：
#   resolution:      [宽, 高]
#   max_size_mb:     最大文件大小（MB）
#   max_duration_sec: 最大时长（秒）
#   aspect_ratio:    宽高比
#   codec:           视频编码
#   formats:         支持的容器格式

douyin:
  resolution: [1080, 1920]
  max_size_mb: 500
  max_duration_sec: 900
  aspect_ratio: "9:16"
  codec: h264
  formats: [mp4]

bilibili:
  resolution: [1920, 1080]
  max_size_mb: 2000
  max_duration_sec: 7200
  aspect_ratio: "16:9"
  codec: h264
  formats: [mp4, flv]

kuaishou:
  resolution: [1080, 1920]
  max_size_mb: 500
  max_duration_sec: 600
  aspect_ratio: "9:16"
  codec: h264
  formats: [mp4]

weixinshipin:
  resolution: [1080, 1920]
  max_size_mb: 600
  max_duration_sec: 1800
  aspect_ratio: "9:16"
  codec: h264
  formats: [mp4]
