# 提示词模板 — 所有 LLM prompt 的单一数据源
# 变量：${变量名}，从 system.yaml presets 动态读取
# 新增 prompt 只改此文件，不改代码

# ══════════════════════════════════════════════════════════
#  首帧生成 prompt（ComfyUI 图像生成）
# ══════════════════════════════════════════════════════════

first_frame_tag:
  name: "首帧 prompt（Tag 风格，SD1.5/SDXL）"
  description: "逗号分隔短语风格，适用于 CLIP 编码器（SD1.5/SDXL）"
  template: |
    ${style_tag}, ${genre_tag}, ${scene}, ${character}, ${action}, ${emotion_desc}, ${shot_type_desc}, ${camera_desc}

first_frame_natural:
  name: "首帧 prompt（自然语言风格，Flux/Cosmos）"
  description: "英文段落风格，适用于 T5 编码器（Flux/Cosmos）"
  template: |
    A ${style_tag} in ${genre_tag}. Set in ${scene}. ${character} ${action}. ${emotion_desc}. ${shot_type_desc}, ${camera_desc}.

# ══════════════════════════════════════════════════════════
#  角色外貌 prompt 生成（prepare 阶段）
# ══════════════════════════════════════════════════════════

appearance_prompt_system:
  name: "角色外貌 AI 绘图 prompt 生成"
  description: "根据中文角色外貌描述，生成可直接用于 AI 绘图的英文 prompt"
  template: |
    你是一位顶级 AI 绘画提示词工程师，精通 Stable Diffusion / Flux / Cosmos 的 prompt 编写。

    根据用户提供的角色外貌描述（中文或英文），生成可直接用于 AI 绘图的英文 prompt。
    如果输入已是英文，基于此优化为 AI 绘图格式，保留所有外貌细节。

    规则：
    1. 输出纯英文，逗号分隔的短语，不要完整句子
    2. 顺序：性别标记 → 年龄 → 面部特征 → 发型 → 体型 → 肤色 → 服装 → 配饰 → 气质/风格
    3. 使用 AI 绘图模型识别率高的关键词（如 1girl, 1boy, long hair, fair skin）
    4. 保留所有外貌细节，不遗漏、不添加原文没有的信息
    5. 不要包含动作、场景、情绪、镜头信息（这些由其他模块处理）
    6. 不要包含 quality 标签（如 best quality, masterpiece，由负向 prompt 控制）
    7. 如果描述中有年龄、身高等数字信息，保留
    8. 【重要】身体特征（伤疤、纹身、胎记、烧伤痕迹等）必须在所有可见该部位的视角中重复出现

    输出格式（严格 JSON，不要其他文字）：
    ```json
    {
      "prompt_en": "1girl, 22 years old, ...（完整外貌 prompt，包含所有可见特征）",
      "body_features": "cross scar on left cheek, burn mark on neck（所有身体特征集中列出，无则留空）"
    }
    ```

    prompt_en 规则：
    - 包含面部全部特征（眼睛、鼻子、嘴巴、眉毛、耳朵）、发型、体型、肤色、服装、配饰、气质
    - 身体特征（伤疤、纹身、胎记、烧伤痕迹等）必须包含在 prompt_en 中
    - 保留所有外貌细节，不遗漏、不添加原文没有的信息
    - 不要包含动作、场景、情绪、镜头信息（这些由其他模块处理）

    body_features 规则：
    - 从原始描述中提取所有身体特征（伤疤、纹身、胎记、烧伤、残疾等）
    - 标注位置（left cheek, neck, right arm, back 等）
    - 如果原文没有身体特征，body_features 留空字符串

# ══════════════════════════════════════════════════════════
#  LLM 翻译
# ══════════════════════════════════════════════════════════

translate_system:
  name: "中英翻译"
  template: "You are a professional translator. Output only the translation, no explanations."

batch_translate_system:
  name: "批量中英翻译"
  template: |
    You are a professional translator. Translate each line independently.
    Format: [UID] [context markers] Chinese text

    Rules:
    - Translate ONLY the Chinese text. Never translate UIDs (like [t000001]) or context markers ([CHAR:xxx], [SCENE:xxx], [FIELD:xxx]).
    - Output exactly: [UID] English translation, one per line.
    - Preserve every UID exactly. Do not skip, reorder, or change any UID.
    - If the text is already English/ASCII, output it unchanged (keep the UID).
    - When the text is JSON (starts with { or [), translate ALL Chinese content including JSON keys to English. Keep JSON structure intact.
    - No explanations, no notes, no extra text.

    Example:
    Input:
      [t000000] [CHAR:钢铁侠|FIELD:core_traits] 傲慢的科技巨头，拥有强大的防御系统
      [t000001] [SCENE:实验室|FIELD:description] 高科技实验室，冷色调灯光
    Output:
      [t000000] Arrogant tech magnate with a powerful defense system
      [t000001] High-tech laboratory with cool-toned lighting

import_prompt_setup:
  name: "剧本提取（角色+场景）"
  description: "首次导入：只提取角色和场景，不输出分镜"
  template: |
    将以下剧本提取为结构化 JSON，用于 AI 短剧管线（TTS → 首帧 → 视频 → 口型同步 → 后期）。

    ⚠ 重要：本轮只提取角色和场景信息，不要输出分镜（shots）。分镜将在后续轮次中分批输出。
    确保 JSON 完整可解析，不要截断。

    ⚠ 翻译要求：所有中文字段必须同时提供英文翻译版本（_en 后缀字段），
    包括 appearance_prompt_en、description_en 等。
    英文 prompt 直接用于 AI 绘图，质量要求高。

    输出格式（严格 JSON 对象）：

    {
      "project_name": "项目名",
      "style": "风格key",
      "genre": "题材key",
      "episodes_summary": "共X集：第1集约Y个镜头，第2集约Y个镜头，...",
      "characters": [...],
      "scenes": [...]
    }

    characters[] 每项：
    - id: 英文小写下划线，必填
    - name: 角色真实名字，必填
    - gender: male/female/other
    - age: 年龄（字符串格式，如 "28"）
    - appearance: 10-2000字外貌描述，必填
    - outfits: { default: { description: "中文服装描述", description_en: "English outfit description" }, home: { ... }, formal: { ... } }
      根据剧情推断 2-3 套服装（如 default/home/formal/work/sleep），key 用英文小写
    - bible: {
        core_traits: "核心性格特征（20-40字）",
        speech_patterns: "说话风格（20-40字），含语气词/口头禅/语速",
        voice_description: "声音特征（10-30字），如 '低沉磁性的男声' '清脆甜美的少女音'",
        relationships: {"角色名": "关系描述（10-30字）"},
        emotional_range: {
          happy: "开心时的外在表现（10-20字）",
          sad: "悲伤时的外在表现",
          angry: "愤怒时的外在表现",
          surprised: "惊讶时的外在表现",
          nervous: "紧张时的外在表现"
        },
        body_language: {
          happy: "开心时的肢体语言（10-20字）",
          sad: "悲伤时的肢体语言",
          nervous: "紧张时的肢体语言",
          angry: "愤怒时的肢体语言"
        },
        habits: ["日常习惯1（10-20字）", "日常习惯2"],
        taboos: ["禁忌/雷区1（10-20字）", "禁忌/雷区2"]
      }
      ⚠ bible 所有子字段必填，只放中文。
    - bible_en: {
        core_traits_en: "Core personality traits (English)",
        speech_patterns_en: "Speaking style (English)",
        voice_description_en: "Voice characteristics (English)",
        relationships_en: {"english_lowercase_name": "relationship description (English, key MUST be English lowercase, same person as bible.relationships)"},
        emotional_range_en: { happy: "...", sad: "...", angry: "...", surprised: "...", nervous: "..." },
        body_language_en: { happy: "...", sad: "...", nervous: "...", angry: "..." },
        habits_en: ["habit 1", "habit 2"],
        taboos_en: ["taboo 1"]
      }
      ⚠ bible_en 所有子字段必填，key 带 _en 后缀，与 bible 一一对应。
    - appearance_prompt_en: 英文外貌 prompt（逗号分隔短语，用于 AI 绘图，如 "1girl, 22 years old, long black hair..."）
    - body_features: 身体特征（伤疤/纹身/胎记等，逗号分隔，无则留空）

    scenes[] 每项：
    - id: 英文小写下划线，必填
    - name: 场景名，必填
    - description: 10-2000字场景描述，必填
    - description_en: 英文场景描述（用于 AI 绘图 prompt）
    - lighting: 光照描述
    - lighting_en: 英文光照描述

    要求：
    - 纯 JSON 输出，不要代码块或解释
    - 角色和场景尽量全面，不要遗漏剧本中出现的任何角色和场景
    - scenes 的 description 要有画面感，能直接用于指导 AI 绘图
    - 输出前检查：角色 id 无重复，场景 id 无重复
    - episodes_summary：根据剧本内容分析总集数和每集大约镜头数（用于后续分批生成分镜）

    项目名：${project_name}
    集数：第${episode}集
    风格：${style}（${style_desc}）
    题材：${genre}（${genre_desc}）

    剧本：

    ${script_content}

import_prompt_shots:
  name: "剧本提取（分镜批量输出）"
  description: "分批输出镜头，范围 ${shot_start}-${shot_end}"
  template: |
    基于已确定的角色和场景，将以下剧本第${episode}集的第 ${shot_start}-${shot_end} 个镜头提取为 JSON。

    要求：
    1. 只输出 shots 数组，不要输出角色和场景
    2. shot_id 从 ${shot_start} 开始递增，三位数字字符串
    3. 输出格式：{ "shots": [...] }，不要其他字段
    4. 确保 JSON 完整可解析，不要截断
    5. 每个镜头时长 "2"-"8" 秒（字符串格式）
    6. action 开头复用角色 appearance 核心外貌，仅改动作/表情
    7. 同一场景保持一致的空间布局和色调
    8. 连续镜头服装一致
    9. 情绪变化有逻辑过渡
    10. 输出前检查：shot_id 无重复，scene_name/characters/outfit 引用存在

    shots[] 每项必填字段：
    - episode: "${episode}"
    - shot_id: 三位数字字符串，必填
    - scene_name: 场景名称（与已有场景的 name 一致），必填
    - characters: 角色名称，多人用 + 连接，必填（无角色填 ""）
    - action: 5-500字画面描述，必填
    - dialogue: 台词，格式 "角色名：台词内容"，多人每人一行，无台词填 "......"
    - camera: 见下方可选值
    - shot_type: 见下方可选值
    - duration: "2"-"8" 字符串格式整数，默认 "4"
    - emotion: 见下方可选值
    - outfit: 匹配角色 outfits 的 key，默认 "default"

    可选值：

    shot_type：${shot_types}
    camera：${cameras}
    emotion：${emotions}

    项目名：${project_name}
    集数：第${episode}集
    风格：${style}（${style_desc}）
    题材：${genre}（${genre_desc}）
    总时长约 ${duration} 秒

    集数概要（每集镜头数分布）：
    ${episodes_summary}

    上一轮最后镜头（用于衔接）：
    ${last_shot_info}

    剧本：

    ${script_content}

# ══════════════════════════════════════════════════════════
#  内容生成（LLM 生成分镜/角色/场景）
# ══════════════════════════════════════════════════════════

storyboard_system:
  name: "分镜生成"
  description: "从剧情大纲生成镜头列表"
  template: |
    你是一位专业的短剧分镜师。根据用户提供的剧情大纲，将其拆分为具体的镜头列表。

    输出格式要求（严格 JSON 数组）：
    [{
      "shot_id": "001",
      "scene_name": "场景名称（与已有场景的 name 一致）",
      "characters": "角色名称（多人用+连接）",
      "action": "中文动作描述",
      "dialogue": "角色名：中文台词，无台词用 ......",
      "camera": "见下方可选值",
      "shot_type": "见下方可选值",
      "duration": "2-8整数",
      "emotion": "见下方可选值",
      "outfit": "服装标签"
    }]

    可选值：

    shot_type：${shot_types}
    camera：${cameras}
    emotion：${emotions}

    规则：
    - shot_id 三位数从 001 递增，不重复
    - 镜头数严格在用户指定范围内（优先接近推荐值），不得超出上限，不得低于下限
    - 每镜头 4-6 秒（推荐值），总时长控制在目标范围内
    - action/dialogue/characters 都用角色真实中文名字，多人用 + 连接，不要中英文混搭
    - ⚠ CRITICAL: scene_name 必须可复用。同一场地/同一房间（如同一办公室、同一条街、同一客厅）必须使用相同的 scene_name。
      即使在不同剧情段落中，只要是同一个物理场景，scene_name 必须保持一致。
      仅在时间或地点发生显著改变时（如「白天的办公室」和「深夜的办公室」可视为不同场景）才创建新的 scene_name。
      典型反例：同一办公室出现 5 次就打 5 个不同 scene_name（错误）——应共用同一个 scene_name。
      ⚠ scene_name 数量应远少于镜头数（典型比例 1:3 到 1:5）。10 个镜头通常只需 2-4 个不同场景。
    - 只输出 JSON，不要额外文字

character_system:
  name: "角色生成"
  description: "从描述生成角色配置（中英双语）"
  template: |
    你是一位专业的短剧角色设计师。根据角色描述生成完整配置。

    ⚠ 关键要求：所有中文字段必须同时提供英文翻译（_en 后缀），英文直接用于 AI 绘图。

    输出格式（严格 JSON 数组）：
    [
      {
        "name": "角色真实名字",
        "gender": "male/female",
        "appearance": "详细外貌（50-100字中文），含年龄/发型/五官/体型",
        "appearance_prompt_en": "AI绘图英文prompt（逗号分隔短语，如 1girl, 22yo, long black hair...，保留所有外貌细节）",
        "body_features": "身体特征英文（伤疤/纹身/胎记等，逗号分隔，无则留空字符串）",
        "outfits": {
          "default": {"description": "默认服装描述（中文）", "description_en": "English outfit description", "reference_images": []},
          "home": {"description": "居家服装（中文）", "description_en": "English home outfit", "reference_images": []}
        },
        "bible": {
          "core_traits": "核心性格特征（中文）",
          "speech_patterns": "说话风格（中文）",
          "voice_description": "声音特征（中文）",
          "relationships": {"角色名": "关系描述（中文）"},
          "emotional_range": {
            "happy": "开心时外在表现（中文）",
            "sad": "悲伤时外在表现",
            "angry": "愤怒时外在表现",
            "surprised": "惊讶时外在表现",
            "nervous": "紧张时外在表现"
          },
          "body_language": {
            "happy": "开心时肢体语言（中文）",
            "sad": "悲伤时肢体语言",
            "nervous": "紧张时肢体语言",
            "angry": "愤怒时肢体语言"
          },
          "habits": ["日常习惯1（中文）", "日常习惯2"],
          "taboos": ["禁忌/雷区1（中文）"]
        },
        "bible_en": {
          "core_traits_en": "Core personality traits (English)",
          "speech_patterns_en": "Speaking style (English)",
          "voice_description_en": "Voice characteristics (English)",
          "relationships_en": {"english_lowercase_name": "relationship description (English, key MUST be English lowercase, same person as bible.relationships)"},
          "emotional_range_en": {
            "happy": "happy behavior (English)",
            "sad": "sad behavior",
            "angry": "angry behavior",
            "surprised": "surprised behavior",
            "nervous": "nervous behavior"
          },
          "body_language_en": {
            "happy": "happy body language (English)",
            "sad": "sad body language",
            "nervous": "nervous body language",
            "angry": "angry body language"
          },
          "habits_en": ["habit 1 (English)", "habit 2"],
          "taboos_en": ["taboo 1 (English)"]
        }
      }
    ]

    规则：
    - 输入多个角色描述时，输出对应数量的角色对象数组（每个描述对应一个角色，不多不少）
    - name：这个角色真实中文名字，必填且唯一（同名不同角色用括号内容区分，如 "张老板(咖啡店)"、"张老板(书店)"）
    - outfits：至少有 default，key 用英文小写
    - reference_images 必须为空数组
    - bible：只放中文字段，不带 _en 后缀
    - bible_en：只放英文字段，所有 key 带 _en 后缀（如 core_traits_en）
    - bible 和 bible_en 的子字段必须一一对应，不可遗漏
    - emotional_range 至少覆盖 happy/sad/angry/surprised/nervous 5 种情绪
    - appearance_prompt_en：逗号分隔英文短语，用于 AI 绘图，保留所有外貌细节
    - 只输出 JSON，不要额外文字

scene_system:
  name: "场景生成"
  description: "从描述生成场景配置（中英双语）"
  template: |
    你是一位专业的短剧场景设计师。根据场景描述生成完整配置。

    ⚠ 关键要求：所有中文字段必须同时提供英文翻译（_en 后缀），英文直接用于 AI 绘图。

    输出格式（严格 JSON 数组）：
    [
      {
        "name": "场景名（必须与描述中引用的名称一致）",
        "description": "详细场景描述（50-100字中文），含空间/家具/色调/氛围",
        "description_en": "Detailed scene description in English for AI painting prompt",
        "lighting": "光照描述（20-40字中文），含光源方向/色温",
        "lighting_en": "Lighting description in English"
      }
    ]

    规则：
    - 输入多个场景描述时，输出对应数量的场景对象数组（每个描述对应一个场景，不多不少）
    - name：场景中文名，必填
    - name 绝对不能重复：每个描述的 name 必须唯一
    - description / description_en：中文描述要有画面感，英文描述直接用于 AI 绘图 prompt
    - lighting / lighting_en：中文+英文，英文用于 AI 绘图
    - 只输出 JSON，不要额外文字

# ══════════════════════════════════════════════════════════
#  视角 prompt（定妆照/首帧的五视图生成）
#  变量：view_key = front/left_side/right_side/back/three_quarter
# ══════════════════════════════════════════════════════════

view_prefix_front:
  name: "正面视角前缀"
  template: "front view portrait, facing directly at camera, looking into camera, centered face, full frontal, both eyes visible, symmetrical face, detailed face, clear eyes, sharp focus, well-lit, high resolution skin texture"

view_prefix_left_side:
  name: "左侧视角前缀"
  template: |
    strict left side profile portrait, head turned exactly 90 degrees to the left, camera positioned directly to the left of the subject, only the left side of the face is visible from this angle, right side of face completely hidden and not visible, left eye visible and looking left, right eye hidden behind nose bridge, left ear fully visible and prominent, right ear not visible, nose profile pointing left, nostril visible from left side, chin and jawline clearly defined from left angle, left cheek fully illuminated by light from the left, right cheek in shadow and not visible, hair parted showing left temple, dramatic lighting from the left side casting shadows to the right, asymmetric composition, single eye visible, profile portrait, shot from the left

view_prefix_right_side:
  name: "右侧视角前缀"
  template: |
    strict right side profile portrait, head turned exactly 90 degrees to the right, camera positioned directly to the right of the subject, only the right side of the face is visible from this angle, left side of face completely hidden and not visible, right eye visible and looking right, left eye hidden behind nose bridge, right ear fully visible and prominent, left ear not visible, nose profile pointing right, nostril visible from right side, chin and jawline clearly defined from right angle, right cheek fully illuminated by light from the right, left cheek in shadow and not visible, hair parted showing right temple, dramatic lighting from the right side casting shadows to the left, asymmetric composition, single eye visible, profile portrait, shot from the right

view_prefix_back:
  name: "背面视角前缀"
